      operationId: createMyPublicPortfolioItem
      summary: Create a portfolio item (Pro+, max 6)
      description: >
        Primary path uses event_id (and optional photo_id) to fill title/date/photo
        from an owned event. Manual title+photo_url remain optional overrides.
