                  type: string
                  format: uuid
                  nullable: true
                  description: Preferred path — create from owned event
                photo_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional event photo id; defaults to first photo
                event_date:
                  type: string
                  format: date
                  nullable: true
                photo_url:
                  type: string
                  description: Required when event_id is omitted
                thumbnail_url:
                  type: string
                  nullable: true
                sort_order:
                  type: integer
                  minimum: 0
                  maximum: 5
