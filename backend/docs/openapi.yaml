  # --- Public professional profile (Issue #787) — path stubs; handlers land in PR2+ ---
  /api/public/organizers:
    get:
      security: []
      operationId: searchPublicOrganizers
      summary: Search the public organizers directory (paginated, unauthenticated, v2.0 #1116)
      description: >
        Returns a paginated slice of PublicOrganizerCard with plan-aware ranking
        (#1129): default relevance = Business featured first, then
        avg_rating * ln(reviews+2), then recency. Distance sort keeps Business
        first then proximity. Only publicable profiles appear (cover, headline/
        about, city+country, ≥1 visible service). Free plan cards omit rating/
        reviews. NG1: visitor has no account.
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Case-insensitive partial match.
        - name: country
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
          description: Membership in the organizer's event_types[].
        - name: q
          in: query
          schema:
            type: string
          description: Text search across business_name/headline/about/city.
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, rating, recent, distance]
            default: relevance
        - name: lat
          in: query
          schema:
            type: number
            format: double
          description: Visitor latitude for bounding-box geo filter + distance sort (#1127). Required with lng for geo.
        - name: lng
          in: query
          schema:
            type: number
            format: double
          description: Visitor longitude for bounding-box geo filter.
        - name: radius_km
          in: query
          schema:
            type: number
            format: double
            default: 50
          description: Bounding-box radius in km (default 50 when lat/lng present).
        - name: min_budget
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: >
            #1128 — match organizers with at least one public package/product price >= min_budget.
        - name: max_budget
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: >
            #1128 — match organizers with at least one public package/product price <= max_budget.
        - name: service_category
          in: query
          schema:
            type: string
          description: >
            #1128 — case-insensitive partial match on active public product category.
        - name: available_on
          in: query
          schema:
            type: string
            format: date
          description: >
            #1128 — YYYY-MM-DD; exclude organizers with unavailable_dates covering that day.
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrganizersResponse"
        "429":
          description: Rate limit exceeded (20 / minute)
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/public/organizers/{slug}:
    get:
      security: []
      operationId: getPublicOrganizerProfile
      summary: Get public professional profile by slug (rate-limited)
