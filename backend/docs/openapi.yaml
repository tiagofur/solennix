  # --- Staff: collaborators catalog (Personal) ---
  /api/staff:
    get:
      operationId: listStaff
      summary: List, search, or paginate the organizer's staff catalog
      description: >-
        Without params returns the full list. `q` returns up to 10 matches by
        name/email/phone similarity. `page` (and optional `limit`, `sort`, `order`)
        returns a paginated envelope. Staff seats are plan-gated (Gratis=1, Pro=2,
        Business=unlimited).
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search term (name/email/phone)
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: When present, enables paginated output
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, created_at, updated_at]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Staff list (plain array) or paginated envelope when page is set
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Staff"
                  - $ref: "#/components/schemas/PaginatedStaffResponse"
        "401":
          description: Unauthorized
        "500":
          description: Failed to fetch staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createStaff
      summary: Create a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpsertRequest"
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "402":
          description: Plan seat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to create staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
