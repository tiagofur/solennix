    post:
      security: []
      operationId: publicRequestClientAction
      summary: Visitor accepts or declines a quote they received (v2.0, NG1)
      description: >
        Identified by the X-Request-Token header (issued when the request was
        created). The visitor has no account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Request-Token
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
