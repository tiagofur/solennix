  /api/organizers/me/requests:
    get:
      operationId: listOrganizerPublicRequests
      summary: List the organizer's quote-request inbox (paginated, v2.0)
      description: >
        Dual pagination. Web uses `page` (offset + total). Mobile uses `cursor`
        (keyset, no total) — pass empty `cursor` on the first page and
        `next_cursor` thereafter (#1121). Also accepts `pagination=cursor`.
      parameters:
        - name: page
          in: query
          description: Offset page (web). Ignored when cursor mode is active.
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor. Presence of this parameter (even empty) enables
            cursor mode for mobile clients.
          schema:
            type: string
        - name: pagination
          in: query
          description: Set to `cursor` to force keyset mode without a cursor token.
          schema:
            type: string
            enum: [cursor]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PublicRequestStatus"
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          description: Only applies to offset (page) mode. Cursor mode sorts by created_at+id.
          schema:
            type: string
            enum: [created_at, event_date]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated inbox (offset or cursor envelope depending on query)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PaginatedPublicRequestsResponse"
                  - $ref: "#/components/schemas/CursorPaginatedPublicRequestsResponse"
        "400":
          description: Invalid cursor token
        "401":
          description: Unauthorized
