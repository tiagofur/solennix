          $ref: "#/components/schemas/SubmitMode"
          default: auto_event
    CreatePublicRequestRequest:
      type: object
      description: >
        Unauthenticated visitor payload submitting a structured quote request
        (profile CTA or shared link). Profile path requires contact_email;
        shared link requires email or phone (auto_event also requires name, phone,
        event_date, event_type, guest_count >= 1).
      properties:
        contact_email:
          type: string
          format: email
          maxLength: 320
        contact_name:
          type: string
          nullable: true
          maxLength: 160
        contact_phone:
          type: string
          nullable: true
          maxLength: 40
        event_type:
          type: string
          nullable: true
          maxLength: 80
        event_date:
          type: string
          format: date
          nullable: true
        location:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        guest_count:
          type: integer
          nullable: true
          minimum: 0
        budget:
          type: number
          format: double
          nullable: true
          minimum: 0
        currency:
          type: string
          default: MXN
          maxLength: 3
        service_ids:
          type: array
          description: Legacy flat list of product IDs (qty defaults to 1). Prefer services[].
          items:
            type: string
            format: uuid
        services:
          type: array
          description: Selected catalog line items with quantity (prices set server-side).
          items:
            type: object
            required: [product_id]
            properties:
              product_id:
                type: string
                format: uuid
              qty:
                type: integer
                minimum: 1
                default: 1
        message:
          type: string
          nullable: true
        website:
          type: string
          description: >
            Honeypot anti-spam field. Must be empty. Bots that fill hidden fields
            receive a fake 201 without creating a request.
          maxLength: 200
        package_id:
          type: string
          format: uuid
          description: >
            When set, server builds a live package quote and freezes package_quote
            on the request (guest_count drives per_guest lines and discount tiers).
