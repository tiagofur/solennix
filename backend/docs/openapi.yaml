            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/payment-submissions/{id}:
    patch:
      operationId: reviewPaymentSubmission
      summary: Approve or reject a pending payment submission
      description: >-
        Approving creates the linked Payment and may auto-confirm a quoted event
        whose deposit is covered, in the same transaction. Only pending
        submissions can be reviewed (409 otherwise).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSubmissionReviewRequest"
      responses:
        "200":
          description: Reviewed submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSubmissionEnvelope"
        "400":
          description: Invalid id/body, or rejection_reason missing on reject
        "401":
          description: Unauthorized
        "404":
          description: Submission not found
        "409":
          description: Submission has already been reviewed
        "500":
          description: Failed to review submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/payment-submissions/{id}/receipt/{filename}:
    get:
      operationId: downloadPaymentSubmissionReceipt
      summary: Download a submission's receipt file (organizer only, no-store)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt file bytes (attachment)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid submission id
        "401":
          description: Unauthorized
        "404":
          description: Submission or receipt not found
  /api/public/events/{token}/payment-submissions:
    get:
      security: []
      operationId: getPublicPaymentSubmissionHistory
      summary: Client-portal payment submission history
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: event_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Submission history (empty array when none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSubmissionListResponse"
        "400":
          description: Missing/invalid query params
        "403":
          description: Client ID does not match the event
        "500":
          description: Failed to fetch submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      security: []
      operationId: createPublicPaymentSubmission
      summary: Submit a payment (transfer reference + optional receipt) from the client portal
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PaymentSubmissionPublicCreateRequest"
      responses:
        "201":
          description: Submission created (status pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSubmissionEnvelope"
        "400":
          description: Invalid form values or event mismatch
        "404":
          description: Invalid link
        "410":
          description: Link revoked or expired
        "500":
          description: Failed to create submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # --- Auth: team invite + email verification ---
  /api/auth/team-invite/accept:
    post:
      security: []
      operationId: acceptTeamInvite
      summary: Activate a team-member account from a staff invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInviteAcceptRequest"
      responses:
        "200":
          description: >-
            Team-member account activated. Dual-transport contract: `tokens` in
            the body serve native clients (Bearer); this response also sets the
            httpOnly `auth_token`/`refresh_token` cookies that carry the web
            session — web clients must ignore the body tokens. Same shape as
            login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: Missing token/password or password policy violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid invite token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invite already used or email taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Invite expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to accept invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/verify-email:
    get:
      security: []
      operationId: verifyEmail
      summary: Verify an email address with a verification token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Missing token
        "401":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/verify-email/resend:
    post:
      security: []
      operationId: resendEmailVerification
      summary: Resend the verification email
      description: Returns the same neutral message whether or not the account exists (no enumeration). Rate-limited per account (cooldown).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Verification email resent if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid email format
        "429":
          description: Resend cooldown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # --- Public analytics beacons ---
  /api/public/page-views:
    post:
      security: []
      operationId: recordPageView
      summary: Marketing page-view beacon (best-effort, always 204)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageViewRecordRequest"
      responses:
        "204":
          description: Recorded (or ignored) — never fails
  /api/public/registration-funnel:
    post:
      security: []
      operationId: recordRegistrationFunnelStep
      summary: Registration funnel beacon (best-effort, always 204)
      description: Only the client-trusted step `register_view` is recorded; server-trusted steps are recorded internally.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationFunnelRecordRequest"
      responses:
        "204":
          description: Recorded (or ignored) — never fails
  # --- Dashboard summary ---
  /api/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Bundled dashboard aggregates in one round-trip
      responses:
        "200":
          description: KPIs + charts + widgets (revenue period=year, status scope=month, top clients limit=5)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
        "500":
          description: Failed to fetch summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # --- Equipment availability ---
  /api/events/equipment/availability:
    get:
      operationId: getEquipmentAvailability
      summary: Available stock per inventory item on a date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: inventory_ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated inventory UUIDs
        - name: exclude_event_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Event being edited (its reservations are excluded)
      responses:
        "200":
          description: Availability per inventory item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipmentAvailabilityItem"
        "400":
          description: Missing date/inventory_ids or invalid UUID
        "401":
          description: Unauthorized
        "500":
          description: Failed to get availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # --- Event reviews ---
  /api/public/reviews/{token}:
    get:
      security: []
      operationId: getPublicReviewRequest
      summary: Get review-request metadata for a one-time token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review request metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReviewMetaEnvelope"
        "400":
          description: Missing token
        "404":
          description: Review request not found
        "410":
          description: Already submitted or expired
    post:
      security: []
      operationId: submitPublicReview
      summary: Submit a post-event review with a one-time token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPublicReviewRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewEnvelope"
        "400":
          description: Invalid body or rating out of range
        "404":
          description: Review request not found
        "409":
          description: Review already submitted for this event
        "410":
          description: Already submitted or expired
  /api/reviews:
    get:
      operationId: listOrganizerReviews
      summary: List reviews received by the organizer
      responses:
        "200":
          description: Reviews (empty array when none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewListResponse"
        "401":
          description: Unauthorized
        "500":
          description: Failed to fetch reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/reviews/{id}/response:
    patch:
      operationId: updateReviewOrganizerResponse
      summary: Set or clear the organizer's public reply to a review (paid plans)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewOrganizerResponseRequest"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewEnvelope"
        "400":
          description: Invalid id or body
        "401":
          description: Unauthorized
        "403":
          description: Requires paid plan or not your review
        "404":
          description: Review not found
        "500":
          description: Failed to update response
  /api/reviews/{id}/visibility:
    patch:
      operationId: updateReviewVisibility
      summary: Toggle a review between private and public testimonial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewVisibilityUpdateRequest"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReviewEnvelope"
        "400":
          description: Invalid id or visibility value
        "401":
          description: Unauthorized
        "403":
          description: Not your review, or public visibility requires a paid plan
        "404":
          description: Review not found
        "500":
          description: Failed to update visibility
  # --- Admin: user maintenance + listing moderation ---
  /api/admin/users/inactive:
    get:
      operationId: getInactiveAdminUsers
      summary: List users with no login in the last N days
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Inactive users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "500":
          description: Failed to get inactive users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/empty-resources:
    get:
      operationId: getAdminUsersWithZeroResources
      summary: List users with zero events, products, and clients
      responses:
        "200":
          description: Users with empty resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "500":
          description: Failed to get users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/{id}/verify-email:
    post:
      operationId: adminVerifyUserEmail
      summary: Manually verify a user's email (audited)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated user (or a message when refetch fails)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid user id
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "500":
          description: Failed to verify email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/{id}/block:
    put:
      operationId: adminBlockUser
      summary: Block an end-user account with a reason (audited)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserRequest"
      responses:
        "200":
          description: Updated user (or a message when refetch fails)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid user id or missing reason
        "401":
          description: Unauthorized
        "403":
          description: Admin only, or only end-user accounts can be blocked
        "404":
          description: User not found
        "409":
          description: User already deleted
        "500":
          description: Failed to block user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/listing-moderation:
    get:
      operationId: listListingModeration
      summary: Directory listing moderation queue (#1130)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [unpublished, pending_review, published, rejected]
            default: pending_review
      responses:
        "200":
          description: Moderation queue (max 50)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationListingListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "500":
          description: Failed to load moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/listing-moderation/{id}/approve:
    post:
      operationId: approveListing
      summary: Approve a directory listing submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider user id
      responses:
        "200":
          description: Updated public profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizerPublicProfile"
        "400":
          description: Invalid user id
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "409":
          description: Invalid status transition
        "500":
          description: Failed to approve listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/listing-moderation/{id}/reject:
    post:
      operationId: rejectListing
      summary: Reject a directory listing submission with a reason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider user id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingModerationRejectRequest"
      responses:
        "200":
          description: Updated public profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizerPublicProfile"
        "400":
          description: Invalid user id or missing reason
        "401":
          description: Unauthorized
        "403":
          description: Admin only
        "409":
          description: Invalid status transition
        "500":
          description: Failed to reject listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/me/public-profile/submit-for-review:
    post:
      operationId: submitProfileForDirectoryReview
      summary: Submit own public profile for directory review
      responses:
        "200":
          description: Submitted profile (envelope, OrganizerPublicProfile shape)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizerPublicProfile"
        "400":
          description: Missing/disabled profile or directory requirements unmet
        "401":
          description: Unauthorized
        "409":
          description: Profile cannot be submitted from its current status
        "500":
          description: Failed to submit for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Listing moderation not configured
