server {
    listen 80;
    server_name localhost;

    # Dynamic public-profile sitemap (robots.txt references this path).
    # Upstream host is injected via env in real deploy; default for compose.
    location = /sitemap-profiles.xml {
        proxy_pass http://backend:8080/api/public/sitemap-profiles.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
